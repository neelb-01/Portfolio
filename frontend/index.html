<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neel Bapat — Full-Stack Developer</title>

    content="Personal portfolio of Neel Bapat — a Computer Engineering student building full-stack tools and data-driven projects in JavaScript, TypeScript, and Python." />
  <meta property="og:title" content="Neel Bapat — Portfolio" />

    content="Full-Stack Developer · Computer Engineer · Data-Driven Projects · Mumbai, India" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0d0d0f" />
  <script>
    // Prevent flash of wrong theme
    (function () {
      const t = localStorage.getItem('portfolio-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t === 'light' || (!t && !prefersDark)) {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>
